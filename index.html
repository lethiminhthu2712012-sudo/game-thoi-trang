<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Phối Đồ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            gap: 40px;
        }
        .character-box {
            position: relative;
            /* CỐ ĐỊNH KÍCH THƯỚC KHUNG ẢNH */
            width: 400px;
            height: 400px;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        .character-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* CHUYỂN SANG COVER ĐỂ PHỦ KÍN */
            object-fit: cover;
            /* ĐỊNH VỊ ẢNH CỐ ĐỊNH TỪ GÓC TRÁI TRÊN */
            object-position: left top;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }
        h2 { color: #d81b60; margin-top: 0; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background-color: #ec407a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #d81b60; }
    </style>
</head>
<body>

<div class="container">
    <div class="character-box">
        <img id="layer-model" src="model.png" alt="Model">
        <img id="layer-bottom" src="" style="display: none;">
        <img id="layer-hair" src="" style="display: none;">
    </div>

    <div class="controls">
        <h2>Tủ đồ của bạn</h2>

        <label><b>Kiểu tóc:</b></label>
        <div class="btn-group">
            <button onclick="changeLayer('layer-hair', 'hair_1.png')">Tóc 1</button>
            <button onclick="changeLayer('layer-hair', '')">Bỏ tóc</button>
        </div>

        <label><b>Trang phục / Váy:</b></label>
        <div class="btn-group">
            <button onclick="changeLayer('layer-bottom', 'bottom_1.png')">Váy 1</button>
            <button onclick="changeLayer('layer-bottom', '')">Bỏ váy</button>
        </div>
    </div>
</div>

<script>
    function changeLayer(layerId, imagePath) {
        const imgElement = document.getElementById(layerId);
        if (imagePath !== '') {
            imgElement.src = imagePath;
            imgElement.style.display = 'block';
        } else {
            imgElement.style.display = 'none';
        }
    }
</script>

</body>
</html>
